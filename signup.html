<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up — Mini Social</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="auth-card">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join the community today</p>
        
        <form id="signup-form">
          <div class="form-group">
            <input type="text" id="signup-name" class="input-box" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <input type="email" id="signup-email" class="input-box" placeholder="Email Address" required />
          </div>
          <div class="form-group">
            <input type="password" id="signup-pass" class="input-box" placeholder="Password" required />
          </div>
          
          <button type="submit" class="primary-btn full-width">Sign Up</button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="index.html">Log In</a></p>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
