<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Mini Social</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Login to your account</p>

      <form id="login-form">
        <div class="form-group">
          <input type="email" id="login-email" class="input-box" placeholder="Email Address" required />
        </div>
        <div class="form-group">
          <input type="password" id="login-pass" class="input-box" placeholder="Password" required />
        </div>

        <button type="submit" class="primary-btn full-width">Log In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
